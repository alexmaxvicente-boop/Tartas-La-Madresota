<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tartas La Madresota — Escritorio y Celular</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,700;6..96,900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0; background: #F3EBD8; color: #C42B34;
    font-family: "DM Sans", system-ui, sans-serif; -webkit-font-smoothing: antialiased;
  }
  .canvas { padding: 46px 40px 80px; display: flex; flex-direction: column; gap: 32px; }
  .badge {
    display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 0.24em;
    text-transform: uppercase; background: #C42B34; color: #FCE9AB; padding: 6px 12px;
  }
  h1 {
    font-family: 'Bodoni Moda', serif; font-weight: 900; font-size: 40px; line-height: 1;
    margin: 16px 0 6px; text-transform: uppercase;
  }
  .sub { margin: 0; font-size: 16px; color: #DC4F7C; }
  .frames { display: flex; flex-wrap: wrap; gap: 40px; align-items: flex-start; }
  .frame-col { display: flex; flex-direction: column; gap: 12px; }
  .frame-label {
    margin: 0; font-size: 11px; font-weight: 700; letter-spacing: 0.24em;
    text-transform: uppercase; color: #DC4F7C;
  }
  iframe { border: 0; display: block; width: 100%; height: 100%; background: #FCE9AB; }

  /* Escritorio */
  .desktop {
    position: relative; width: 1360px; max-width: 100%; height: 900px; background: #FCE9AB;
    box-shadow: 0 30px 70px -40px rgba(196,43,52,0.6);
  }
  .chrome {
    height: 44px; background: #C42B34; display: flex; align-items: center; gap: 8px; padding: 0 16px;
  }
  .dot { width: 11px; height: 11px; border-radius: 999px; }
  .url { margin-left: 14px; font-size: 12px; letter-spacing: 0.12em; color: rgba(252,233,171,0.8); }
  .desktop .viewport { height: calc(100% - 44px); }

  /* Celular */
  .phone {
    position: relative; width: 390px; max-width: 100%; height: 844px; background: #FCE9AB;
    border-radius: 42px; overflow: hidden; box-shadow: 0 30px 70px -40px rgba(196,43,52,0.6);
  }
  .statusbar {
    position: absolute; top: 0; left: 0; right: 0; height: 46px; z-index: 20;
    background: linear-gradient(#FCE9AB 60%, rgba(252,233,171,0));
    display: flex; align-items: flex-start; justify-content: space-between;
    padding: 12px 26px 0; font-size: 13px; font-weight: 700; color: #C42B34;
    pointer-events: none;
  }
  .phone .viewport { height: 100%; padding-top: 46px; }
</style>
</head>
<body>
<div class="canvas">
  <div>
    <span class="badge">5a</span>
    <h1>Arma tu tarta — escritorio y celular</h1>
    <p class="sub">La misma página en dos anchos. Puedes hacer scroll y usar el armador dentro de cada marco.</p>
  </div>

  <div class="frames">
    <div class="frame-col">
      <p class="frame-label">Escritorio — 1360 px</p>
      <div class="desktop">
        <div class="chrome">
          <span class="dot" style="background:#FCE9AB;opacity:.9"></span>
          <span class="dot" style="background:#FC8A2D"></span>
          <span class="dot" style="background:#DC4F7C"></span>
          <span class="url">tartaslamadresota.mx</span>
        </div>
        <div class="viewport"><iframe src="index.html" title="Tartas La Madresota — vista de escritorio"></iframe></div>
      </div>
    </div>

    <div class="frame-col">
      <p class="frame-label">Celular — 390 px</p>
      <div class="phone">
        <div class="statusbar">
          <span>9:41</span>
          <span style="letter-spacing:.1em">▂▄▆ ▮</span>
        </div>
        <div class="viewport"><iframe src="index.html" title="Tartas La Madresota — vista de celular"></iframe></div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
